services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/banking-demo.db
      CONSENT_EXPIRY_SECONDS: ${CONSENT_EXPIRY_SECONDS:-300}
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/data

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  backend_data:
